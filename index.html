<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Silver Tech Synergy · AdobeCC Setup Progress</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..700&family=Inter:wght@300..700&display=swap" rel="stylesheet">
<style>
  :root {
    /* Light theme — warm cream + amber accent (RootSys "paper" scheme) */
    --bg: #FAF7F1;
    --bg-gradient: radial-gradient(1200px 600px at 70% -10%, #F6ECD8 0%, var(--bg) 55%);
    --card: #FFFDF9;
    --border: #E9E1D4;
    --border-strong: #D6C9B6;
    --step-bg: #F3EEE5;
    --track: #F3EEE5;
    --accent: #C4954A;
    --accent-fg: #2B211B;
    --accent-soft: #F6ECD8;
    --accent-text: #82591B;
    --done: #5E8C61;
    --done-text: #3F6844;
    --done-soft: #EAF1E3;
    --pending: #C4954A;
    --pending-text: #82591B;
    --pending-soft: #F7EEDB;
    --bad: #B5483B;
    --none: #B0A292;
    --text: #33281F;
    --text-2: #4A3B32;
    --muted: #6F5F52;
    --faint: #B0A292;
    --popup-shadow: rgba(51,40,31,.22);
    --btn-hover-shadow: rgba(196,149,74,.22);
    --box-hover-shadow: rgba(196,149,74,.18);
    --border-active: var(--accent);
    --topbar-bg: rgba(255,253,249,.85);
    --topbar-text: #33281F;
    --topbar-muted: #6F5F52;
    --topbar-btn-border: #E9E1D4;
    --topbar-btn-hover: #F3EEE5;
    --logo-chip: transparent;
    --logo-chip-border: transparent;
    --radius: 12px;
  }
  html.dark {
    /* Dark theme — deep teal + warm amber (RootSys "night" scheme) */
    --bg: #0B1415;
    --bg-gradient: radial-gradient(1200px 600px at 70% -10%, #122528 0%, var(--bg) 55%);
    --card: #111D1F;
    --border: #1F3033;
    --border-strong: #2C4447;
    --step-bg: #18272A;
    --track: #18272A;
    --accent: #E8B04E;
    --accent-fg: #1A1305;
    --accent-soft: rgba(232,176,78,0.14);
    --accent-text: #F0C36E;
    --done: #6BC59A;
    --done-text: #8FD9B4;
    --done-soft: rgba(107,197,154,0.14);
    --pending: #E8B04E;
    --pending-text: #F0C36E;
    --pending-soft: rgba(232,176,78,0.12);
    --bad: #E5766A;
    --none: #5F7674;
    --text: #ECF3F2;
    --text-2: #CFDCDA;
    --muted: #98ADAB;
    --faint: #5F7674;
    --popup-shadow: rgba(0,0,0,.55);
    --btn-hover-shadow: rgba(232,176,78,.22);
    --box-hover-shadow: rgba(232,176,78,.16);
    --border-active: var(--accent);
    --topbar-bg: rgba(17,29,31,.82);
    --topbar-text: #ECF3F2;
    --topbar-muted: #98ADAB;
    --topbar-btn-border: #1F3033;
    --topbar-btn-hover: #18272A;
    --logo-chip: transparent;
    --logo-chip-border: transparent;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-feature-settings: 'cv11', 'ss01';
    background: var(--bg-gradient);
    background-attachment: fixed;
    min-height: 100vh;
    color: var(--text);
    padding: 40px 20px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    transition: background .3s ease, color .3s ease;
  }
  /* Top bar */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 40;
    background: var(--topbar-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--topbar-btn-border);
    color: var(--topbar-text);
    transition: background .3s ease, color .3s ease;
  }
  .topbar-inner {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 20px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: .9rem; letter-spacing: -.01em; white-space: nowrap; }
  .brand .logo {
    width: 34px; height: 34px;
    display: flex; align-items: center; justify-content: center;
    background: none;
    border: none;
    border-radius: 0;
    overflow: visible;
  }
  .brand .logo img { width: 100%; height: 100%; object-fit: contain; }
  .topbar-right { display: flex; align-items: center; gap: 8px; }
  .topbar-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 12px;
    border-radius: 999px;
    border: 1px solid var(--topbar-btn-border);
    background: transparent;
    color: var(--topbar-text);
    font-family: inherit;
    font-size: .78rem;
    font-weight: 500;
    cursor: pointer;
    transition: all .18s ease;
    white-space: nowrap;
  }
  .topbar-btn:hover { border-color: var(--accent); background: var(--topbar-btn-hover); }
  .topbar-btn svg { width: 14px; height: 14px; }
  .topbar-btn.spinning svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .last-refresh {
    display: flex; align-items: center; gap: 7px;
    font-size: .76rem;
    color: var(--topbar-muted);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--none); }
  .status-dot.ok { background: var(--done); animation: pulse 2s ease infinite; }
  .status-dot.err { background: var(--bad); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }

  .container { max-width: 1100px; margin: 0 auto; padding-top: 76px; }
  header { text-align: center; margin-bottom: 38px; }
  h1 {
    font-family: 'Archivo', 'Inter', system-ui, sans-serif;
    font-size: 2.1rem;
    font-weight: 600;
    letter-spacing: -.025em;
    color: var(--text);
  }
  header p { color: var(--muted); margin-top: 9px; font-size: 0.92rem; }

  /* School buttons */
  .school-buttons {
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 40px;
  }
  .school-btn {
    position: relative;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 20px 32px;
    border-radius: 16px;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: -.01em;
    cursor: pointer;
    transition: all .2s ease;
    text-align: center;
    min-width: 200px;
  }
  .school-btn:hover { transform: translateY(-2px); border-color: var(--border-strong); box-shadow: 0 6px 20px var(--btn-hover-shadow); }
  .school-btn.active {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent-text);
    box-shadow: inset 0 0 0 1px var(--accent);
  }
  .school-btn .sub { display: block; font-size: .78rem; font-weight: 400; color: var(--muted); margin-top: 7px; font-variant-numeric: tabular-nums; }
  .school-btn.active .sub { color: var(--accent-text); opacity: .95; }

  /* School view */
  #school-view { display: none; animation: fadeUp .4s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .view-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 20px;
  }
  .view-header h2 {
    font-family: 'Archivo', 'Inter', system-ui, sans-serif;
    font-size: 1.4rem;
    font-weight: 600;
    letter-spacing: -.02em;
    color: var(--text);
  }
  .overall { color: var(--muted); font-size: .9rem; }
  .overall b { color: var(--text-2); font-weight: 600; font-variant-numeric: tabular-nums; }

  .progress-track {
    height: 8px;
    border-radius: 999px;
    background: var(--track);
    overflow: hidden;
    margin-bottom: 28px;
  }
  .progress-fill {
    height: 100%;
    width: 0;
    border-radius: 999px;
    background: var(--accent);
    transition: width .8s cubic-bezier(.2,.8,.2,1);
  }

  /* PC grid */
  .pc-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 14px;
  }
  .pc-box {
    width: 130px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 12px 16px;
    cursor: pointer;
    transition: all .2s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .pc-box:hover { transform: translateY(-2px); border-color: var(--border-strong); box-shadow: 0 6px 18px var(--box-hover-shadow); }
  .pc-box .monitor { font-size: 2.1rem; line-height: 1; transition: opacity .25s ease; }
  .pc-box.finished { border-color: var(--done); background: var(--done-soft); }
  .pc-box .name { margin-top: 9px; font-weight: 650; font-size: .92rem; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  .pc-box .count { font-size: .73rem; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .dots { display: flex; gap: 5px; margin-top: 11px; justify-content: center; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--none); opacity: .35; }
  .dot.done { background: var(--done); opacity: 1; }
  .dot.pending { background: var(--pending); opacity: 1; }

  /* Detail popup */
  #popup {
    position: fixed;
    inset: 0;
    background: rgba(11,20,21,.55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 50;
  }
  #popup.show { display: flex; animation: fadeUp .2s ease; }
  .popup-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 26px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 20px 60px var(--popup-shadow);
  }
  .popup-card h3 {
    font-family: 'Archivo', 'Inter', system-ui, sans-serif;
    font-size: 1.25rem;
    font-weight: 600;
    letter-spacing: -.02em;
    margin-bottom: 5px;
  }
  .popup-card .remote { color: var(--muted); font-size: .86rem; margin-bottom: 18px; font-variant-numeric: tabular-nums; }
  .step {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    border-radius: 10px;
    background: var(--step-bg);
    border: 1px solid var(--border);
    margin-bottom: 9px;
  }
  .step .label { font-weight: 500; font-size: .9rem; color: var(--text-2); }
  .badge {
    padding: 4px 11px;
    border-radius: 999px;
    font-size: .68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .55px;
  }
  .badge.done { background: var(--done-soft); color: var(--done-text); }
  .badge.pending { background: var(--pending-soft); color: var(--pending-text); }
  .badge.none { background: var(--step-bg); color: var(--faint); }
  .popup-close {
    margin-top: 14px;
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 999px;
    background: var(--accent);
    color: var(--accent-fg);
    font-family: inherit;
    font-size: .95rem;
    font-weight: 600;
    cursor: pointer;
    transition: filter .18s ease;
  }
  .popup-close:hover { filter: brightness(1.06); }

  .loading, .error { text-align: center; color: var(--muted); padding: 40px; font-size: .92rem; }
  .error { color: var(--bad); }
  footer { text-align: center; color: var(--faint); font-size: .78rem; margin-top: 44px; }
  .refresh-info { display: none; }
</style>
</head>
<body>
<div class="container">
  <!-- Top bar -->
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="logo"><img src="sts.png" alt="STS logo"></div>
        <span>Silver Tech Synergy</span>
      </div>
      <div class="topbar-right">
        <div class="last-refresh">
          <div class="status-dot" id="status-dot"></div>
          <span id="last-refresh">Loading…</span>
        </div>
        <button class="topbar-btn" id="refresh-btn" title="Refresh data from Google Sheets" onclick="refreshAll()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
          <span>Refresh</span>
        </button>
        <button class="topbar-btn" id="theme-toggle" onclick="toggleTheme()" title="Toggle light / dark mode">🌙</button>
      </div>
    </div>
  </div>

  <header>
    <h1>AdobeCC Setup Progress</h1>
    <p>Silver Tech Synergy · Select a school to view PC installation status</p>
  </header>

  <div class="school-buttons" id="school-buttons"></div>

  <div id="school-view">
    <div class="view-header">
      <h2 id="school-title"></h2>
      <div class="overall" id="overall"></div>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="pc-grid" id="pc-grid"></div>
    <div class="refresh-info" id="refresh-info"></div>
  </div>

  <footer>Silver Tech Synergy · Data pulled live from Google Sheets · Click Refresh or reload to update</footer>
</div>

<!-- PC detail popup -->
<div id="popup" onclick="if(event.target===this)closePopup()">
  <div class="popup-card">
    <h3 id="popup-title"></h3>
    <div class="remote" id="popup-remote"></div>
    <div id="popup-steps"></div>
    <button class="popup-close" onclick="closePopup()">Close</button>
  </div>
</div>

<script>
/* ============================================================
   CONFIG — Google Sheets published CSV links (one per tab/school)
   ============================================================ */
const SHEETS = {
  "T.Ibrahim": "https://docs.google.com/spreadsheets/d/e/2PACX-1vSKy65xY0dfsMwlfcdeIi1wawWtSvTTEXmXvbyEi-Pnv5au9MwCVFE8eBGqwgbDZ4NfLOeMipqWEj8z/pub?gid=0&single=true&output=csv",
  "T.Mizan":   "https://docs.google.com/spreadsheets/d/e/2PACX-1vSKy65xY0dfsMwlfcdeIi1wawWtSvTTEXmXvbyEi-Pnv5au9MwCVFE8eBGqwgbDZ4NfLOeMipqWEj8z/pub?gid=1311811681&single=true&output=csv",
  "Binjai":    "https://docs.google.com/spreadsheets/d/e/2PACX-1vSKy65xY0dfsMwlfcdeIi1wawWtSvTTEXmXvbyEi-Pnv5au9MwCVFE8eBGqwgbDZ4NfLOeMipqWEj8z/pub?gid=625991493&single=true&output=csv",
};
/* Display names shown on buttons and headers (keyed by sheet key above) */
const DISPLAY_NAMES = {
  "T.Ibrahim": "SMK Tengku Ibrahim",
  "T.Mizan":   "SMK Tengku Mizan Zainal Abidin",
  "Binjai":    "SMK Binjai",
};
/* ============================================================ */

/* Theme: default light (warm paper), remembers choice */
(function initTheme() {
  const saved = localStorage.getItem("theme");
  if (saved === "dark") document.documentElement.classList.add("dark");
})();
function toggleTheme() {
  const dark = document.documentElement.classList.toggle("dark");
  localStorage.setItem("theme", dark ? "dark" : "light");
  updateThemeIcon();
}
function updateThemeIcon() {
  document.getElementById("theme-toggle").textContent =
    document.documentElement.classList.contains("dark") ? "☀️" : "🌙";
}

const STEPS = ["adobecc-installer", "adobecc-installed", "license-installed"];
const STEP_LABELS = { "adobecc-installer": "AdobeCC Installer", "adobecc-installed": "AdobeCC Installed", "license-installed": "License Installed" };

let currentSchool = null;
let currentPCs = [];

// Build school buttons
const btnWrap = document.getElementById("school-buttons");
Object.keys(SHEETS).forEach(name => {
  const b = document.createElement("button");
  b.className = "school-btn";
  b.id = "btn-" + name;
  b.innerHTML = (DISPLAY_NAMES[name] || name) + '<span class="sub">Loading…</span>';
  b.onclick = () => showSchool(name);
  btnWrap.appendChild(b);
});

function parseCSV(text) {
  const rows = [];
  let row = [], cur = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"' && text[i+1] === '"') { cur += '"'; i++; }
      else if (c === '"') inQ = false;
      else cur += c;
    } else if (c === '"') inQ = true;
    else if (c === ',') { row.push(cur); cur = ""; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i+1] === '\n') i++;
      row.push(cur); rows.push(row); row = []; cur = "";
    } else cur += c;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  const headers = rows.shift().map(h => h.trim().toLowerCase());
  return rows
    .filter(r => r.some(v => v.trim() !== ""))
    .map(r => {
      const obj = {};
      headers.forEach((h, i) => obj[h] = (r[i] || "").trim());
      return obj;
    });
}

function statusOf(v) {
  v = (v || "").trim().toLowerCase();
  if (v === "done" || v === "yes" || v === "true" || v === "1" || v === "✔") return "done";
  if (v === "pending" || v === "no" || v === "false" || v === "0") return "pending";
  return "none";
}

async function loadSchool(name) {
  try {
    const res = await fetch(SHEETS[name] + "&t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const rows = parseCSV(await res.text());
    const btn = document.getElementById("btn-" + name);
    const doneCount = rows.filter(pc => STEPS.every(s => statusOf(pc[s]) === "done")).length;
    btn.querySelector(".sub").textContent = rows.length + " PCs · " + doneCount + " fully done";
    return rows;
  } catch (e) {
    document.getElementById("btn-" + name).querySelector(".sub").textContent = "⚠ Failed to load";
    throw e;
  }
}

// (button summaries are loaded by refreshAll() on startup)

function setRefreshStatus(state, text) {
  const dot = document.getElementById("status-dot");
  dot.className = "status-dot " + (state || "");
  document.getElementById("last-refresh").textContent = text;
}

let lastRefreshTime = null;
function markRefreshed(ok) {
  lastRefreshTime = new Date();
  setRefreshStatus(ok ? "ok" : "err",
    (ok ? "Updated " : "Error · ") + lastRefreshTime.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }));
}

async function refreshAll() {
  const btn = document.getElementById("refresh-btn");
  btn.classList.add("spinning");
  setRefreshStatus("", "Syncing…");
  const results = await Promise.allSettled(Object.keys(SHEETS).map(name => loadSchool(name)));
  btn.classList.remove("spinning");
  const anyOk = results.some(r => r.status === "fulfilled");
  markRefreshed(anyOk);
  // If a school view is open, re-render it with fresh data
  if (currentSchool) {
    const rows = await loadSchool(currentSchool).catch(() => null);
    if (rows) { currentPCs = rows; renderSchool(rows); }
  }
}
// Initial load
refreshAll();

async function showSchool(name) {
  currentSchool = name;
  document.querySelectorAll(".school-btn").forEach(b => b.classList.remove("active"));
  document.getElementById("btn-" + name).classList.add("active");
  const view = document.getElementById("school-view");
  const grid = document.getElementById("pc-grid");
  view.style.display = "block";
  document.getElementById("school-title").textContent = DISPLAY_NAMES[name] || name;
  grid.innerHTML = '<div class="loading">Loading PCs…</div>';

  let rows;
  try {
    rows = await loadSchool(name);
  } catch {
    grid.innerHTML = '<div class="error">⚠ Could not load data for ' + name + '. Check the sheet is published and the link is correct.</div>';
    return;
  }

  currentPCs = rows;
  renderSchool(rows);
}

function renderSchool(rows) {
  const grid = document.getElementById("pc-grid");
  const totalSteps = rows.length * STEPS.length;
  const doneSteps = rows.reduce((n, pc) => n + STEPS.filter(s => statusOf(pc[s]) === "done").length, 0);
  const pct = totalSteps ? Math.round(doneSteps / totalSteps * 100) : 0;
  const fullyDone = rows.filter(pc => STEPS.every(s => statusOf(pc[s]) === "done")).length;

  document.getElementById("overall").innerHTML =
    "<b>" + fullyDone + "/" + rows.length + "</b> PCs fully done · <b>" + pct + "%</b> overall";
  requestAnimationFrame(() => document.getElementById("progress-fill").style.width = pct + "%");

  grid.innerHTML = "";
  rows.forEach((pc, i) => {
    const statuses = STEPS.map(s => statusOf(pc[s]));
    const doneN = statuses.filter(st => st === "done").length;
    const box = document.createElement("div");
    box.className = "pc-box" + (doneN === STEPS.length ? " finished" : "");
    box.style.animationDelay = (i * 0.03) + "s";
    box.innerHTML =
      '<div class="monitor">🖥️</div>' +
      '<div class="name">' + (pc["pc-id"] || pc["pc-no"] || "PC") + '</div>' +
      '<div class="count">' + doneN + "/" + STEPS.length + ' steps</div>' +
      '<div class="dots">' + statuses.map(st => '<div class="dot ' + st + '"></div>').join("") + '</div>';
    box.onclick = () => openPopup(pc, statuses);
    grid.appendChild(box);
  });

  document.getElementById("refresh-info").textContent = "";
}

function openPopup(pc, statuses) {
  document.getElementById("popup-title").textContent = pc["pc-id"] || pc["pc-no"] || "PC";
  document.getElementById("popup-remote").textContent = pc["remote-id"] ? "Remote ID: " + pc["remote-id"] : "Remote ID: (not yet assigned)";
  document.getElementById("popup-steps").innerHTML = STEPS.map((s, i) => {
    const st = statuses[i];
    const label = st === "done" ? "Done" : st === "pending" ? "Pending" : "—";
    return '<div class="step"><span class="label">' + STEP_LABELS[s] + '</span><span class="badge ' + st + '">' + label + '</span></div>';
  }).join("");
  document.getElementById("popup").classList.add("show");
}
function closePopup() { document.getElementById("popup").classList.remove("show"); }
document.addEventListener("keydown", e => { if (e.key === "Escape") closePopup(); });
updateThemeIcon();
</script>
</body>
